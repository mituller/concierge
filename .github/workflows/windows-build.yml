name: Windows build

# Builds the Windows installer, proving the app compiles and bundles on Windows (WebView2, IMAP
# over SChannel TLS, Windows certificate store for corporate proxies). Runs on pushes to main and
# on demand (Actions -> Windows build -> Run workflow); a release build takes ~10-15 minutes.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: concierge-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
