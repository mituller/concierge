[package]
name = "concierge"
version = "0.1.0"
description = "Concierge — mail inbox triage & classification"
authors = []
edition = "2021"

[lib]
name = "concierge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
# rustls-tls-native-roots adds the macOS system trust store to the default
# webpki roots, so TLS-intercepting corporate proxies (Zscaler) are trusted.
tauri-plugin-http = { version = "2", features = ["rustls-tls-native-roots"] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = "2"
native-tls = "0.2"
